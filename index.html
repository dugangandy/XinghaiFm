<!-- ── 背景氛围 ─────────────────────────────────────────── -->
<div class="bg" aria-hidden="true">
  <div class="bg-aurora a1"></div>
  <div class="bg-aurora a2"></div>
  <div class="bg-aurora a3"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>
</div>

<div class="app" id="app">
  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brand" role="button" tabindex="0" title="回到首页">
      <div class="brand-mark eq-mark"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="brand-text">
        <span class="brand-line"><strong>星海 FM</strong><span class="brand-ver" id="brandVer" hidden></span></span>
        <small>LOCAL AUDIO LIBRARY</small>
      </div>
    </div>

    <div class="side-actions">
      <button class="side-lib-btn" id="libSwitch" title="切换资源库">
        <span class="lib-badge" id="libBadge">库</span>
        <span class="lib-txt">
          <b id="libName">选择资源库</b>
          <small id="libPath">点这里添加资源库</small>
        </span>
        <svg class="i lib-caret"><use href="#i-down"/></svg>
      </button>
      <button class="side-ghost-btn" id="btnSync" title="重新扫描当前资源库">
        <svg class="i"><use href="#i-refresh"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-section">
      <div class="side-title">
        <span>分类</span>
        <button class="mini-btn" id="btnAddCat" title="新建分类"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div class="cat-list" id="catList"></div>
    </div>

    <div class="side-foot">
      <div class="lib-stat" id="libStat">尚未载入资源库</div>
      <div class="side-hint">数据仅存本机，全程离线</div>
    </div>
  </aside>
  <div class="drawer-mask" id="drawerMask"></div>

  <!-- 主区 -->
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="切换侧栏" aria-controls="sidebar" aria-expanded="true"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="search" id="searchWrap">
        <svg class="i search-ic"><use href="#i-search"/></svg>
        <input id="searchInput" type="text" placeholder="搜索专辑、演播者或单集…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" hidden><svg class="i"><use href="#i-close"/></svg></button>
        <kbd>/</kbd>
      </div>
      <div class="top-right">
        <button class="icon-btn" id="btnLogout" title="退出登录" hidden><svg class="i"><use href="#i-logout"/></svg></button>
        <button class="link-state" id="linkState" hidden><i class="dot-pulse"></i><span id="linkStateText">离线</span></button>
        <span class="scan-state" id="scanState" hidden><i class="dot-pulse"></i><span id="scanStateText">扫描中</span></span>
      </div>
    </header>
    <div class="view" id="view"></div>
    <!-- 切换资源库时的加载过渡层：盖住主区，切完淡出 -->
    <div class="lib-loading" id="libLoading" aria-hidden="true">
      <div class="lib-loading-box">
        <div class="lib-loading-orbit"><i></i><i></i><i></i><div class="core"><svg class="i"><use href="#i-library"/></svg></div></div>
        <div class="lib-loading-name" id="libLoadingName">资源库</div>
        <div class="lib-loading-hint" id="libLoadingHint">正在载入…</div>
      </div>
    </div>
  </main>
</div>

<!-- 音频专用元素：不要放进隐藏容器，安卓 WebView 的 video 管线换源会卡死 -->
<audio id="mediaAudio" preload="metadata"></audio>

<!-- ── 底部播放条 ───────────────────────────────────────── -->
<div class="playerbar" id="playerbar" hidden>
  <div class="pb-left">
    <div class="pb-cover" id="pbCover" data-char="声"><span></span></div>
    <div class="pb-meta">
      <div class="pb-line">
        <span class="pb-kind" id="pbKind" hidden><svg class="i"><use href="#i-video"/></svg>视频</span>
        <div class="pb-title" id="pbTitle">—</div>
      </div>
      <div class="pb-sub" id="pbSub">选择一集开始收听</div>
    </div>
    <button class="icon-btn pb-fav" id="pbFav" title="收藏专辑"><svg class="i"><use href="#i-heart"/></svg></button>
  </div>

  <div class="pb-center">
    <div class="pb-controls">
      <button class="icon-btn" id="btnPrev" title="上一集 (P)"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="icon-btn skip-btn" id="btnBack15" title="后退 15 秒 (←)"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="play-btn" id="btnPlay" title="播放 / 暂停 (空格)"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn skip-btn" id="btnFwd15" title="前进 15 秒 (→)"><svg class="i"><use href="#i-fwd"/></svg></button>
      <button class="icon-btn" id="btnNext" title="下一集 (N)"><svg class="i"><use href="#i-next"/></svg></button>
    </div>
    <div class="pb-scrub-row">
      <span class="tnum cur" id="pbCur">0:00</span>
      <div class="scrub" id="pbScrub" role="slider" aria-label="播放进度" tabindex="0">
        <div class="scrub-track"><div class="scrub-buf"></div><div class="scrub-fill"></div><div class="scrub-thumb"></div></div>
        <div class="scrub-tip" id="pbTip">0:00</div>
      </div>
      <span class="tnum dur" id="pbDur">0:00</span>
    </div>
  </div>

  <div class="pb-right">
    <button class="chip rate-chip" id="btnRate" title="倍速">1.0×</button>
    <button class="icon-btn loop-btn" id="btnLoop" title="播放模式"><svg class="i"><use href="#i-repeat"/></svg></button>
    <div class="vol-wrap" id="volWrap">
      <button class="icon-btn" id="btnVol" title="静音 (M)"><svg class="i"><use href="#i-volume"/></svg></button>
      <div class="vol-pop" id="volPop">
        <span class="vol-num" id="volNum">100</span>
        <div class="vol-track" id="volScrub" role="slider" aria-label="音量" tabindex="0">
          <div class="vol-fill"></div><div class="vol-knob"></div>
        </div>
      </div>
    </div>
    <button class="icon-btn" id="btnExpand" title="展开播放页 (F)"><svg class="i"><use href="#i-up"/></svg></button>
  </div>
</div>

<!-- ── 全屏播放页 ───────────────────────────────────────── -->
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-glow" id="sheetGlow"></div>
  <canvas class="viz" id="viz"></canvas>
  <div class="sheet-inner">
    <header class="sheet-top">
      <button class="icon-btn" id="btnCollapse" title="收起 (Esc)"><svg class="i"><use href="#i-down"/></svg></button>
      <span class="sheet-kicker">NOW PLAYING</span>
      <button class="icon-btn" id="btnSheetQueue" title="播放队列"><svg class="i"><use href="#i-list"/></svg></button>
    </header>

    <div class="sheet-stage">
      <div class="sheet-cover" id="sheetCover" data-char="声">
        <span class="sc-char"></span>
        <i class="sc-ring"></i>
      </div>

      <!-- 视频模式：画面 + 浮层控件（B 站式） -->
      <div class="vstage is-paused vhidden" id="vStage">
        <video id="media" playsinline preload="metadata"></video>
        <div class="v-loading" id="vLoading" hidden><i></i></div>
        <button class="v-bigplay" id="vBigPlay" title="播放 / 暂停 (空格)"><svg class="i"><use href="#i-play"/></svg></button>

        <div class="v-ui" id="vUi">
          <div class="v-top">
            <button class="icon-btn v-ic" id="vCollapse" title="收起播放页 (Esc)"><svg class="i"><use href="#i-down"/></svg></button>
            <div class="v-meta">
              <div class="v-title" id="vTitle">—</div>
              <div class="v-sub" id="vSub">—</div>
            </div>
            <button class="v-btn" id="vQueue" title="选集"><svg class="i"><use href="#i-list"/></svg><span>选集</span></button>
          </div>

          <div class="v-bottom">
            <div class="scrub v-scrub" id="vScrub" role="slider" aria-label="播放进度" tabindex="0">
              <div class="scrub-track"><div class="scrub-buf"></div><div class="scrub-fill"></div><div class="scrub-thumb"></div></div>
              <div class="scrub-tip" id="vTip">0:00</div>
            </div>
            <div class="v-bar">
              <button class="icon-btn v-ic" id="vPlay" title="播放 / 暂停 (空格)"><svg class="i"><use href="#i-play"/></svg></button>
              <button class="icon-btn v-ic" id="vPrev" title="上一集 (P)"><svg class="i"><use href="#i-prev"/></svg></button>
              <button class="icon-btn v-ic" id="vNext" title="下一集 (N)"><svg class="i"><use href="#i-next"/></svg></button>
              <span class="v-time"><b id="vCur">0:00</b><em>/</em><span id="vDur">0:00</span></span>
              <i class="v-gap"></i>
              <button class="v-txt" id="vRate" title="倍速">1.0×</button>
              <div class="vol-wrap v-vol">
                <button class="icon-btn v-ic" id="vVol" title="静音 (M)"><svg class="i"><use href="#i-volume"/></svg></button>
                <div class="vol-pop">
                  <span class="vol-num" id="vVolNum">100</span>
                  <div class="vol-track" id="vVolScrub" role="slider" aria-label="音量" tabindex="0">
                    <div class="vol-fill"></div><div class="vol-knob"></div>
                  </div>
                </div>
              </div>
              <button class="icon-btn v-ic" id="vPip" title="画中画"><svg class="i"><use href="#i-pip"/></svg></button>
              <button class="icon-btn v-ic" id="vCinema" title="影院模式"><svg class="i"><use href="#i-cinema"/></svg></button>
              <button class="icon-btn v-ic" id="vFull" title="全屏"><svg class="i"><use href="#i-full"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="sheet-meta">
      <h2 id="shTitle">—</h2>
      <p id="shSub">—</p>
    </div>

    <div class="sheet-scrub-row">
      <span class="tnum" id="shCur">0:00</span>
      <div class="scrub big" id="shScrub" role="slider" aria-label="播放进度" tabindex="0">
        <div class="scrub-track"><div class="scrub-buf"></div><div class="scrub-fill"></div><div class="scrub-thumb"></div></div>
        <div class="scrub-tip" id="shTip">0:00</div>
      </div>
      <span class="tnum" id="shDur">0:00</span>
    </div>

    <div class="sheet-controls">
      <button class="icon-btn" id="shBack" title="后退 15 秒"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="icon-btn big" id="shPrev" title="上一集"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="play-btn huge" id="shPlay"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn big" id="shNext" title="下一集"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="shFwd" title="前进 15 秒"><svg class="i"><use href="#i-fwd"/></svg></button>
    </div>

    <div class="sheet-extra">
      <button class="chip" id="shRate"><span>倍速</span><b>1.0×</b></button>
      <button class="chip" id="shLoop"><svg class="i"><use href="#i-repeat"/></svg><span>列表循环</span></button>
      <button class="chip" id="shSleep"><svg class="i"><use href="#i-moon"/></svg><span>定时关闭</span></button>
      <button class="chip" id="shFav"><svg class="i"><use href="#i-heart"/></svg><span>收藏</span></button>
    </div>
  </div>

  <div class="queue-panel" id="queuePanel" hidden>
    <div class="queue-head">
      <strong>播放队列</strong>
      <span class="muted" id="queueCount"></span>
      <button class="icon-btn" id="btnQueueClose"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="queue-body" id="sheetQueue"></div>
  </div>
</section>

<div class="boot" id="boot">
  <div class="boot-orb"><div class="eq-mark"><span></span><span></span><span></span><span></span><span></span></div></div>
  <div class="boot-name">星海 <b>FM</b></div>
  <div class="boot-bar"><i></i></div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/media.js"></script>
<script src="js/fs.js"></script>
<script src="js/covers.js"></script>
<script src="js/library.js"></script>
<script src="js/viz.js"></script>
<script src="js/player.js"></script>
<script src="js/android.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
