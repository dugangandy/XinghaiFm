name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # 打 tag 时创建 Release 需要写权限（默认 GITHUB_TOKEN 只读）

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：新版 runner 镜像上它装不上 cmdline-tools。
      # 自己下载固定版本，铺在 runner.temp 里，路径一定可写。
      - name: 安装 Android SDK
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/ct.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/ct.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK 就绪：$SDK"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/XinghaiFM-$V-debug.apk"
          ls -l out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: XinghaiFM-apk
          path: out/*.apk
          if-no-files-found: error

      # 只有 tag 触发的构建才发布；workflow_dispatch 手动跑只留 artifact。
      # runner 自带 gh，不额外引第三方 action。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" out/*.apk \
            --title "星海FM ${GITHUB_REF_NAME}" \
            --notes "Android 调试版 APK：XinghaiFM-${V}-debug.apk（debug 签名，需允许安装未知来源应用）" \
            --verify-tag
