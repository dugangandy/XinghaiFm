<!doctype html>
<meta charset="utf-8">
<title>星海 FM · Logo 方案</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:40px;background:#080b12;color:#e8eefc;
       font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  h1{font-size:18px;letter-spacing:.04em;margin:0 0 6px}
  p.sub{margin:0 0 32px;color:#7a869e;font-size:12.5px}
  .grid{display:flex;gap:28px;flex-wrap:wrap}
  .card{flex:1 1 300px;border:1px solid rgba(255,255,255,.08);border-radius:18px;
        background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));padding:22px}
  .card h2{font-size:13px;letter-spacing:.06em;margin:0 0 2px}
  .card small{display:block;color:#7a869e;font-size:11.5px;margin-bottom:16px}
  .big{width:168px;height:168px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.55))}
  .sizes{display:flex;align-items:flex-end;gap:14px;margin-top:20px}
  .lockup{display:flex;align-items:center;gap:12px;margin-top:18px}
  .lockup .wm{display:flex;flex-direction:column;line-height:1.15}
  .lockup .wm b{font-size:17px;letter-spacing:.06em;font-weight:800;
    background:linear-gradient(100deg,#fff,#bfe9ff 40%,#d9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lockup .wm i{font-style:normal;font-size:9px;letter-spacing:.22em;color:#5b6580;margin-top:3px}
  .light{background:#eef2f8;border-radius:14px;padding:16px;margin-top:22px;display:flex;gap:16px;align-items:center}
  .light span{color:#33415c;font-size:11.5px}
</style>
<h1>星海 FM · 图标方案</h1>
<p class="sub">三版都是 512×512 圆角方，渐变沿用界面的青 → 紫 → 粉。SVG 可任意缩放，下面的小尺寸就是同一个文件渲染的。</p>
<div class="grid">
  <div class="card">
    <h2>A · 星浪</h2><small>四角星 + 波纹，最直白：星与海</small>
    <img class="big" src="logo-a.svg" alt="A">
    <div class="sizes">
      <img src="logo-a.svg" width="64"><img src="logo-a.svg" width="48">
      <img src="logo-a.svg" width="32"><img src="logo-a.svg" width="16">
    </div>
    <div class="lockup">
      <img src="logo-a.svg" width="34">
      <div class="wm"><b>星海 FM</b><i>LOCAL AUDIO LIBRARY</i></div>
    </div>
  </div>
  <div class="card">
    <h2>B · 声格（采用）</h2><small>五根声波柱 + 星点，延续侧栏的跳动均衡器</small>
    <img class="big" src="logo-b.svg" alt="B">
    <div class="sizes">
      <img src="logo-b.svg" width="64"><img src="logo-b.svg" width="48">
      <img src="logo-b.svg" width="32"><img src="logo-b.svg" width="16">
    </div>
    <div class="lockup">
      <img src="logo-b.svg" width="34">
      <div class="wm"><b>星海 FM</b><i>LOCAL AUDIO LIBRARY</i></div>
    </div>
  </div>
  <div class="card">
    <h2>C · 星环</h2><small>断口圆环 + 星，偏"轨道 / 信号"</small>
    <img class="big" src="logo-c.svg" alt="C">
    <div class="sizes">
      <img src="logo-c.svg" width="64"><img src="logo-c.svg" width="48">
      <img src="logo-c.svg" width="32"><img src="logo-c.svg" width="16">
    </div>
    <div class="lockup">
      <img src="logo-c.svg" width="34">
      <div class="wm"><b>星海 FM</b><i>LOCAL AUDIO LIBRARY</i></div>
    </div>
  </div>
</div>
<div class="light">
  <img src="logo-a.svg" width="40"><img src="logo-b.svg" width="40"><img src="logo-c.svg" width="40">
  <span>浅色背景下的可辨识度（深色底图标的天然弱项，若要多端复用需另出浅色版）</span>
</div>
