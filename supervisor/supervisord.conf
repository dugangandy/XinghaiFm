; 星海 FM · supervisord 配置
; 由 supervisor/ctl.sh 调用：ctl.sh start|stop|restart|status|log
; 被管理的进程：tools/tunnel.js（它内部会拉起本地 tools/serve.js 并维持 SSH 反向隧道）

[unix_http_server]
file=%(ENV_HOME)s/.supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_HOME)s/.supervisor/supervisord.log
pidfile=%(ENV_HOME)s/.supervisor/supervisord.pid
childlogdir=%(ENV_HOME)s/.supervisor/logs
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.supervisor/supervisor.sock

[program:xinghai-fm]
command=/usr/local/bin/node tools/tunnel.js
directory=/Volumes/Macintosh HD/Users/app/XinghaiFm
autostart=true
autorestart=unexpected
; tunnel.js 自己会重连 10 次，只有它以非 0 退出才需要 supervisor 再拉一次
startsecs=10
startretries=5
stopwaitsecs=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.supervisor/logs/xinghai-fm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="%(ENV_HOME)s",PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin",LANG="zh_CN.UTF-8"
