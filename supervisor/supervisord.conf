; 星海 FM · supervisord 配置
; 由 supervisor/ctl.sh 调用：ctl.sh start|stop|restart|status|log
; 被管理的进程：tools/tunnel.js（它内部会拉起本地 tools/serve.js 并维持 SSH 反向隧道）

[unix_http_server]
file=%(ENV_HOME)s/.supervisor/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_HOME)s/.supervisor/supervisord.log
pidfile=%(ENV_HOME)s/.supervisor/supervisord.pid
childlogdir=%(ENV_HOME)s/.supervisor/logs
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.supervisor/supervisor.sock

; ── 注意 supervisord 的启动方式 ──
; macOS 的 TCC 按「启动链的责任进程」判权限：LaunchAgent 直接跑 supervisord 时，
; 责任进程是 Apple 的 Python.app，它下面的 serve.js 读 NAS/网络卷会被拒成 EPERM
; （能 stat、一读就 Operation not permitted）。所以 LaunchAgent 改成
; launchd → node supervisor/launch.js → supervisord，责任进程变成 node；
; 给 node 开一次「完全磁盘访问权限」，整棵子进程树都能读 NAS。
; 直接命令行跑 supervisord 调试时，读 NAS 仍会失败——那是预期行为，别当成 bug。
[program:xinghai-fm]
command=/usr/local/bin/node tools/tunnel.js
directory=/Volumes/Macintosh HD/Users/app/XinghaiFm
autostart=true
autorestart=unexpected
; tunnel.js 自己会重连 10 次，只有它以非 0 退出才需要 supervisor 再拉一次
startsecs=10
startretries=5
stopwaitsecs=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.supervisor/logs/xinghai-fm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="%(ENV_HOME)s",PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin",LANG="zh_CN.UTF-8"

; 其他项目的程序配置。supervisord 的 [include] files 按空白切分，
; 而项目路径带空格（"Macintosh HD"），所以统一用 ~/.supervisor/conf.d 下的软链接接入：
;   ln -sfn "/path/to/project/supervisor/xxx.conf" ~/.supervisor/conf.d/xxx.conf
[include]
files = %(ENV_HOME)s/.supervisor/conf.d/*.conf
